# ==============================================================================
# CẤU HÌNH REDIS 7 CHO BULLMQ QUEUE & RATE LIMITER
# ==============================================================================

# Lắng nghe kết nối mạng nội bộ container
bind 0.0.0.0
protected-mode no
port 6379

# Cơ chế lưu trữ bền vững AOF (Append-Only File) để bảo vệ Job trong BullMQ
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Giới hạn bộ nhớ tối đa cho Redis (đáp ứng trần 192MB RAM của container)
maxmemory 128mb

# Chính sách khi đầy bộ nhớ: Tuyệt đối KHÔNG xóa ngầm job của BullMQ
# Khi đầy 128MB, Redis sẽ báo lỗi OOM command để hệ thống biết và xử lý
maxmemory-policy noeviction

# Tắt RDB snapshot tự động nếu chỉ dùng AOF để tiết kiệm I/O đĩa
save ""

# Tối ưu hóa hiệu năng
tcp-backlog 511
timeout 0
tcp-keepalive 300
loglevel notice
