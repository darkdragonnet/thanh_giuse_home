# ==============================================================================
# HỆ THỐNG ONBOARDING ĐĂNG KÝ KHUÔN MẶT HỌC SINH (HANET CLOUD)
# MA TRẬN DOCKER TỐI ƯU HÓA CHO VPS 3GB RAM (TỔNG RAM LIMIT <= 2.112 MB)
# ==============================================================================

networks:
  thanh_giuse_net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  shared_images_volume:
    driver: local

services:
  # ----------------------------------------------------------------------------
  # 1. NGINX REVERSE PROXY & STATIC SPA (RAM Limit: 128MB)
  # ----------------------------------------------------------------------------
  app_proxy:
    build:
      context: ..
      dockerfile: docker/nginx/Dockerfile
    container_name: thanh_giuse_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "8080:80"
    volumes:
      - shared_images_volume:/app/storage/images:ro
      - shared_images_volume:/app/uploads:ro
    depends_on:
      - app_api
    networks:
      - thanh_giuse_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          memory: 32M

  # ----------------------------------------------------------------------------
  # 2. POSTGRESQL 16 (RAM Limit: 512MB)
  # ----------------------------------------------------------------------------
  app_postgres:
    image: postgres:16-alpine
    container_name: thanh_giuse_postgres
    restart: unless-stopped
    command: >
      postgres
      -c shared_buffers=128MB
      -c max_connections=40
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-thanh_giuse_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-super_secure_postgres_password_change_me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - thanh_giuse_net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 256M

  # ----------------------------------------------------------------------------
  # 3. REDIS 7 (BullMQ & Rate Limiter) (RAM Limit: 192MB)
  # ----------------------------------------------------------------------------
  app_redis:
    image: redis:7-alpine
    container_name: thanh_giuse_redis
    restart: unless-stopped
    command: >
      redis-server /usr/local/etc/redis/redis.conf
      --requirepass ${REDIS_PASSWORD:-super_secure_redis_password_change_me}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - thanh_giuse_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 192M
        reservations:
          memory: 64M

  # ----------------------------------------------------------------------------
  # 4. NODE.JS REST API SERVER (RAM Limit: 512MB)
  # ----------------------------------------------------------------------------
  app_api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: thanh_giuse_api:latest
    container_name: thanh_giuse_api
    restart: unless-stopped
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NODE_OPTIONS: "--max-old-space-size=384"
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres_user:super_secure_postgres_password_change_me@app_postgres:5432/thanh_giuse_db}
      REDIS_URL: ${REDIS_URL:-redis://:super_secure_redis_password_change_me@app_redis:6379/0}
      UPLOAD_DIR: /app/uploads
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_for_admin_session_change_me}
      ADMIN_SECRET_TOKEN: ${ADMIN_SECRET_TOKEN:-admin_secret_super_secure_token}
      HANET_API_BASE_URL: ${HANET_API_BASE_URL:-https://partner.hanet.ai}
      HANET_ACCESS_TOKEN: ${HANET_ACCESS_TOKEN:-}
      HANET_PLACE_ID: ${HANET_PLACE_ID:-998577}
    volumes:
      - shared_images_volume:/app/uploads
    depends_on:
      - app_postgres
      - app_redis
    networks:
      - thanh_giuse_net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 128M

  # ----------------------------------------------------------------------------
  # 5. BULLMQ WORKER PROCESSOR (RAM Limit: 768MB, Concurrency: 1)
  # ----------------------------------------------------------------------------
  app_worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    image: thanh_giuse_worker:latest
    container_name: thanh_giuse_worker
    restart: unless-stopped
    stop_grace_period: 150s # Chờ worker hoàn thành request 120s trước khi shutdown
    working_dir: /app
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NODE_OPTIONS: "--max-old-space-size=512"
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres_user:super_secure_postgres_password_change_me@app_postgres:5432/thanh_giuse_db}
      REDIS_URL: ${REDIS_URL:-redis://:super_secure_redis_password_change_me@app_redis:6379/0}
      UPLOAD_DIR: /app/uploads
      HANET_API_BASE_URL: ${HANET_API_BASE_URL:-http://app_mock:4000}
      HANET_MOCK_URL: http://app_mock:4000
      STATIC_BASE_URL: http://app_proxy/tmp-faces
      HANET_CLIENT_ID: ${HANET_CLIENT_ID:-}
      HANET_CLIENT_SECRET: ${HANET_CLIENT_SECRET:-}
      HANET_ACCESS_TOKEN: ${HANET_ACCESS_TOKEN:-mock_token}
      HANET_PLACE_ID: ${HANET_PLACE_ID:-196}
    volumes:
      - shared_images_volume:/app/uploads
    depends_on:
      - app_postgres
      - app_redis
      - app_mock
    networks:
      - thanh_giuse_net
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 768M
        reservations:
          memory: 256M

  # ----------------------------------------------------------------------------
  # 6. HANET MOCK SERVER (RAM Limit: 128MB, Test & Dev Harness)
  # ----------------------------------------------------------------------------
  app_mock:
    build:
      context: ..
      dockerfile: apps/hanet-mock/Dockerfile
    container_name: app_mock
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=4000
      - HOST=0.0.0.0
    ports:
      - "4000:4000"
    networks:
      - thanh_giuse_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          memory: 32M

