# docker/nginx/default.conf

# Giới hạn kích thước file upload 5MB tương thích API
client_max_body_size 5M;

# Gzip Compression tối ưu truyền tải file tĩnh
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

server {
    listen 80;
    server_name _;
    absolute_redirect off;

    # -------------------------------------------------------------
    # 0. Cổng Danh Sách Lớp Công Khai (/classes)
    # -------------------------------------------------------------
    location = /classes {
        alias /usr/share/nginx/html/student/classes.html;
        default_type text/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location = /classes/ {
        alias /usr/share/nginx/html/student/classes.html;
        default_type text/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # -------------------------------------------------------------
    # 1. Frontend Học sinh (Static SPA Build)
    # -------------------------------------------------------------
    location = / {
        return 302 /l/;
    }

    location = /l {
        return 301 /l/;
    }

    location ^~ /l/ {
        alias /usr/share/nginx/html/student/;
        try_files $uri $uri/ /l/index.html;
        
        # Cache busting cho index.html
        location = /l/index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }

    # -------------------------------------------------------------
    # 2. Frontend Admin Dashboard (Static SPA Build)
    # -------------------------------------------------------------
    location = /admin {
        alias /usr/share/nginx/html/admin/index.html;
        default_type text/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location ^~ /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;

        # Cache vĩnh viễn cho static assets có hash
        location ~* \.(?:css|js|woff2?|png|jpg|jpeg|gif|ico|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Cache busting cho index.html
        location = /admin/index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }

    # Cache vĩnh viễn cho static assets dùng chung có hash (js, css, fonts, v.v.)
    location ~* \.(?:css|js|woff2?|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # -------------------------------------------------------------
    # 3. Phục vụ Ảnh tĩnh & Ảnh tạm cho HANET Cloud (Shared Docker Volume)
    # -------------------------------------------------------------
    location /tmp-faces/ {
        alias /app/uploads/tmp-faces/;
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        access_log off;
    }

    location /uploads/ {
        alias /app/uploads/;
        expires 1h;
        add_header Cache-Control "private, no-transform";
        access_log off;
    }

    location /images/ {
        alias /app/storage/images/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # -------------------------------------------------------------
    # 4. Backend Fastify REST API Proxy
    # -------------------------------------------------------------
    location /api/ {
        proxy_pass http://app_api:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Chuyển tiếp IP thật phục vụ Rate Limiter
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # BẮT BUỘC: Đảm bảo Nginx không lọc các Header nghiệp vụ từ app_api
        proxy_pass_header X-Class-Code;
        proxy_pass_header X-Class-Name;
        proxy_pass_header X-Teacher-Verified;

        # BẢO VỆ CORS: Cho phép Trình duyệt Client (JavaScript fetch) đọc được 3 custom headers này
        add_header 'Access-Control-Expose-Headers' 'X-Class-Code, X-Class-Name, X-Teacher-Verified' always;
        
        # Timeout cho các request nén hoặc xử lý
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # -------------------------------------------------------------
    # 5. Hệ Thống Bỏ Phiếu Gia Trưởng (/giatruong/)
    # -------------------------------------------------------------
    location /giatruong/ {
        proxy_pass http://app_api:3000/giatruong/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Chống Cache triệt để trên Zalo WebView
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires -1;

        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location = /giatruong {
        return 301 /giatruong/;
    }
}

