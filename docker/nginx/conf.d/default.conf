server {
    listen 80;
    server_name localhost;

    # Giới hạn kích thước payload ảnh tải lên tối đa 5MB (chặn tấn công DDoS/OOM)
    client_max_body_size 5M;

    # Phục vụ Static Files của Single Page Application (SPA)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Chuyển tiếp các yêu cầu API đến Node.js Backend Container
    location /api/ {
        proxy_pass http://app_api:3000;
        proxy_http_version 1.1;
        
        # Chuyển tiếp đầy đủ Header để Backend nhận diện chính xác IP của người dùng
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeout proxy
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Trang lỗi tùy chỉnh
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
