# docker/nginx/default.conf

# Giới hạn kích thước file upload 5MB tương thích API
client_max_body_size 5M;

# Gzip Compression tối ưu truyền tải file tĩnh
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

server {
    listen 80;
    server_name _;

    # -------------------------------------------------------------
    # 1. Frontend Học sinh (Static SPA Build)
    # -------------------------------------------------------------
    location = /l {
        return 301 /l/;
    }

    location ^~ /l/ {
        alias /usr/share/nginx/html/student/;
        try_files $uri $uri/ /l/index.html;
        
        # Cache busting cho index.html
        location = /l/index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }

    # -------------------------------------------------------------
    # 2. Frontend Admin Dashboard (Static SPA Build)
    # -------------------------------------------------------------
    location = /admin {
        alias /usr/share/nginx/html/admin/index.html;
        default_type text/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location ^~ /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;

        # Cache vĩnh viễn cho static assets có hash
        location ~* \.(?:css|js|woff2?|png|jpg|jpeg|gif|ico|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Cache busting cho index.html
        location = /admin/index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }

    # Cache vĩnh viễn cho static assets dùng chung có hash (js, css, fonts, v.v.)
    location ~* \.(?:css|js|woff2?|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # -------------------------------------------------------------
    # 3. Phục vụ Ảnh tĩnh đã resize (Shared Docker Volume)
    # -------------------------------------------------------------
    location /images/ {
        alias /app/storage/images/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # -------------------------------------------------------------
    # 4. Backend Fastify REST API Proxy
    # -------------------------------------------------------------
    location /api/ {
        proxy_pass http://app_api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeout cho các request nén hoặc xử lý
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
