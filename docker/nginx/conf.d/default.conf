server {
    listen 80;
    server_name localhost;

    # Giới hạn kích thước payload ảnh tải lên tối đa 5MB (chặn tấn công DDoS/OOM)
    client_max_body_size 5M;

    # Endpoint kiểm tra sức khỏe Nginx
    location /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Phục vụ Static Files của Single Page Application (SPA)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Phục vụ URL ảnh tạm thời cho HANET Cloud registerByUrl tải về (Phương án A - ADR-002)
    location /tmp-faces/ {
        alias /app/uploads/tmp-faces/;
        autoindex off;
        expires 10m;
        add_header Cache-Control "public, no-transform";
        # Chỉ cho phép các phương thức đọc an toàn
        limit_except GET HEAD {
            deny all;
        }
    }

    # Chuyển tiếp các yêu cầu API đến Node.js Backend Container (Fastify)
    location /api/ {
        # Sử dụng Docker embedded DNS để không làm crash Nginx khi container app_api khởi động sau
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api_upstream http://app_api:3000;
        proxy_pass $api_upstream;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Trang lỗi tùy chỉnh
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
